[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "alembic",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   
    "F",   
    "I",   
    "UP",  
    "B",  
]

[tool.ruff.lint.isort]
known-first-party = ["app"]